spring:
  application:
    name: fasearch
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:5MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:6MB}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration, classpath:db/seed
    
    baseline-on-migrate: false 

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

jwt:
  secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
  api-prefix: /api
  timeout-seconds: 15

brevo:
  api-url: ${BREVO_API_URL:https://api.brevo.com}
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:no-reply@fasearch.local}
  sender-name: ${BREVO_SENDER_NAME:FaSearch}
  timeout-seconds: ${BREVO_TIMEOUT_SECONDS:10}

email:
  # Round nay login KHONG chan tai khoan chua xac thuc (FE chi hien banner).
  # Bat chan dang nhap bang EMAIL_VERIFICATION_REQUIRED=true.
  verification-required: ${EMAIL_VERIFICATION_REQUIRED:false}
  verify-token-hours: ${EMAIL_VERIFY_TOKEN_HOURS:24}
  reset-token-minutes: ${EMAIL_RESET_TOKEN_MINUTES:30}

app:
  frontend-base-url: ${APP_FRONTEND_URL:http://127.0.0.1:3202}

shipping:
  warehouse:
    address: ${SHIPPING_WAREHOUSE_ADDRESS:140 Lê Trọng Tấn, Tân Phú, TP.HCM}
    # OSM/Nominatim one-off 2026-11-05: way/523650595 (HUIT, house number 140).
    latitude: ${SHIPPING_WAREHOUSE_LATITUDE:10.8070354}
    longitude: ${SHIPPING_WAREHOUSE_LONGITUDE:106.6287031}
  road-factor: ${SHIPPING_ROAD_FACTOR:1.3}
  tiers:
    near-km: 3
    middle-km: 7
    outer-km: 15
    near-fee: 15000
    middle-fee: 25000
    outer-fee: 35000
    extra-per-km: 3000
    cap: 150000
