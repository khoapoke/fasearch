name: qdrant-fasearch # Tên nhóm dự án sẽ hiển thị trên Docker Desktop

networks:
  app-network:      # Khai báo một mạng nội bộ dùng chung
    driver: bridge

services:
 
  qdrant:
    image: qdrant/qdrant:v1.19-gpu-nvidia
    container_name: qdrant-server
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - $STORAGE_DOCKER:/qdrant/storage
    networks:
      - app-network # Đưa qdrant vào mạng này
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
