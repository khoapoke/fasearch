    attribute: color
    operator: DARKER_THAN
    value: red
    reference: anchor
    priority: primary
    source: author_gold
    confidence: 1.0

must_preserve:
  - constraint_id: c2
    attribute: category
    operator: SAME_AS
    value: null
    reference: anchor
    priority: primary
    source: author_gold
    confidence: 1.0

must_not:
  - constraint_id: c3
    attribute: pattern
    operator: IN
    value: [graphic, text_print]
    reference: query
    priority: primary
    source: author_gold
    confidence: 1.0

soft_preference: []
