schema_version: 1.0.0
config_id: week4-pilot-evaluation-v1
pilot_only: true
ks: [1, 5, 10]
document_unit: product_version
precision:
  strict_relevant_grade: 2
  relaxed_relevant_grade: 1
recall:
  strict_relevant_grade: 2
  relaxed_relevant_grade: 1
target_recall:
  definition: designated target appears in top K after excluding the query product when requested
mrr:
  strict_relevant_grade: 2
  relaxed_relevant_grade: 1
latency:
  unit: milliseconds
  percentiles: [50, 95]
  scope: end_to_end_per_query
qrels_policy:
  cannot_judge: excluded
  unjudged: excluded_from_scientific_claims
  note: pilot fixture qrels validate code only and are not a final benchmark
