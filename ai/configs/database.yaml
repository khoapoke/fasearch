# ==========================================
# CẤU HÌNH CƠ SỞ DỮ LIỆU VECTOR (QDRANT)
# ==========================================
qdrant:
  host: "localhost"
  grpc_port: 6334
  http_port: 6333
  collection_name: "image_gallery"
  vector_size: 512
  prefer_grpc: true

# ==========================================
# CẤU HÌNH MÔ HÌNH AI (CLIP)
# ==========================================
model:
  id: "openai/clip-vit-base-patch32"
  device: "auto"  # Đặt 'auto' để code tự ưu tiên chọn cuda nếu có

# ==========================================
# CẤU HÌNH HỆ THỐNG VÀ ỨNG DỤNG
# ==========================================
app:
  upload_dir: "storage/uploads"
  raw_data_dir: "dataset"
  max_search_limit: 5  # Giới hạn số lượng kết quả tối đa mỗi lần tìm
  vector_size: 512